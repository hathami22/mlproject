<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prédiction du type d'établissement</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f9f9f9; }
        h1 { color: #333; }
        form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; max-width: 500px; }
        .form-field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], input[type="float"] { width: 100%; padding: 8px; box-sizing: border-box; }
        input[type="checkbox"] { margin-right: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .prediction { margin-top: 20px; padding: 15px; background-color: #e1f5fe; border-left: 5px solid #039be5; }
    </style>
</head>
<body>
    <h1>Prédiction du type d'établissement</h1>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-field">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div style="color:red">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Prédire</button>
    </form>

    {% if prediction %}
        <div class="prediction">
            <strong>Prédiction :</strong> {{ prediction }}
        </div>
    {% endif %}
</body>
</html>
